<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background-image: url('https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1600&q=80');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-10">

  <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-sm">

    <h1 class="text-2xl font-bold text-gray-800 text-center mb-2">Login</h1>
    <p class="text-gray-500 text-center mb-6">Sign in to your account</p>

    <div th:if="${successing}" class="mb-4 text-sm text-green-700 bg-green-100 border border-green-300 rounded-md px-3 py-2">
      <span th:text="${successing}"></span>
    </div>

    <div th:if="${errormessage}" class="mb-4 text-sm text-red-700 bg-red-100 border border-red-300 rounded-md px-3 py-2">
      <span th:text="${errormessage}"></span>
    </div>

    <form method="post" th:action="@{/loginForm}" th:object="${user}" class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" placeholder="Enter your email" th:field="*{email}"
               class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" placeholder="Enter your password" th:field="*{password}"
               class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md">
        Login
      </button>

    </form>

    <div class="text-center text-sm text-gray-500 mt-6">
      <a th:href="@{/index.html}" class="text-blue-600 hover:underline">Home</a>
      <span class="mx-2">|</span>
      <a th:href="@{/regPage}" class="text-blue-600 hover:underline">Register</a>
    </div>

  </div>

</body>
</html>
